# Con cada cambio en main, development o una rama feature/…: prueba Pixie y arma el instalador
# en Windows (queda para bajar en «Artifacts» y probarlo antes de publicarlo).
# Solo en main, y si la versión de package.json es nueva, la publica como Release:
# las Pixie instaladas ven esa Release y muestran el botón «Actualizar».
# Por eso lo nuevo va primero a development y pasa a main recién cuando está probado.
name: Pixie

on:
  push:
    branches: [main, development, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixie-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Las pruebas no necesitan bajar Electron (usan uno de mentira)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Armar el instalador
        run: npx electron-builder --win --publish never

      # Publica si es main y esta versión todavía no tiene una Release completa (con latest.yml).
      # En development y en las ramas feature/ nunca publica.
      - name: ¿Es una versión nueva?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          completas=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq "[.[] | select(.tag_name == \"v$v\" and .draft == false and ([.assets[].name] | index(\"latest.yml\")))] | length")
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$completas" = "0" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

      # gh crea la Release, sube los tres archivos y recién ahí la publica:
      # nunca queda una Release a medias que las Pixie instaladas puedan ver.
      - name: Publicar la versión ${{ steps.version.outputs.version }}
        if: steps.version.outputs.publicar == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # Si quedó una Release a medias de esta versión, se borra (con su etiqueta) y se hace de nuevo
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"v$v\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          git push origin ":refs/tags/v$v" 2> /dev/null || true
          gh release create "v$v" \
            "dist/Pixie-$v-instalador.exe" \
            "dist/Pixie-$v-instalador.exe.blockmap" \
            dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Pixie $v" \
            --generate-notes \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: pixie-instalador-${{ github.ref_name == 'main' && 'main' || 'prueba' }}
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
